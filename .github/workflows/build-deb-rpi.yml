name: Build Debian Package for Raspberry Pi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SDL_VERSION: "2.32.8"

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build ARM64 .deb package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libsamplerate0-dev \
            libmpfr-dev \
            libgmp-dev \
            libvncserver-dev \
            libpng-dev \
            wget \
            git \
            debhelper \
            devscripts \
            dh-make \
            fakeroot \
            lintian

      - name: Build SDL2 from source
        run: |
          set -e
          echo "=== Building SDL2 ${SDL_VERSION} from source ==="
          wget -q https://www.libsdl.org/release/SDL2-${SDL_VERSION}.tar.gz
          tar -zxf SDL2-${SDL_VERSION}.tar.gz
          cd SDL2-${SDL_VERSION}
          ./configure \
            --prefix=/usr/local \
            --disable-video-opengl \
            --disable-video-x11 \
            --disable-pulseaudio \
            --disable-esd \
            --disable-video-wayland \
            --enable-video-kmsdrm \
            --enable-libudev \
            --enable-input-events
          echo "=== SDL2 configure summary (input related) ==="
          grep -i -E '(udev|evdev|input|kmsdrm|drm|gbm)' config.log | tail -30 || true
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build BasiliskII
        run: |
          set -e
          echo "=== Building BasiliskII ==="
          cd BasiliskII/src/Unix
          NO_CONFIGURE=1 ./autogen.sh
          CFLAGS="-march=armv8-a -mtune=cortex-a72" \
          CXXFLAGS="-march=armv8-a -mtune=cortex-a72" \
          LDFLAGS="" \
          ac_cv_have_asm_extended_signals=yes \
          ./configure \
            --prefix=/usr \
            --enable-sdl-audio \
            --enable-sdl-video \
            --enable-vosf \
            --enable-addressing=direct \
            --without-mon \
            --without-esd \
            --without-gtk \
            --with-vncserver \
            --enable-jit-compiler \
            --enable-aarch64-jit-experimental \
            --disable-nls
          CPATH=$CPATH:/usr/local/include/SDL2 make -j$(nproc)

      - name: Create Debian package
        run: |
          set -e
          echo "=== Creating Debian package ==="

          # Get version from git or use default
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            VERSION="1.0.$(date +%Y%m%d)"
          fi

          ARCH="arm64"
          PKG_NAME="basiliskii-sdl"
          PKG_DIR="${PKG_NAME}_${VERSION}_${ARCH}"

          # Create package directory structure
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/share/basiliskii-sdl
          mkdir -p ${PKG_DIR}/usr/share/man/man1
          mkdir -p ${PKG_DIR}/usr/share/doc/basiliskii-sdl
          mkdir -p ${PKG_DIR}/usr/lib

          # Copy binary
          cp BasiliskII/src/Unix/BasiliskII ${PKG_DIR}/usr/bin/
          strip ${PKG_DIR}/usr/bin/BasiliskII

          # Copy data files
          cp BasiliskII/src/Unix/keycodes ${PKG_DIR}/usr/share/basiliskii-sdl/
          cp BasiliskII/src/Unix/fbdevices ${PKG_DIR}/usr/share/basiliskii-sdl/
          cp BasiliskII/src/Unix/tunconfig ${PKG_DIR}/usr/share/basiliskii-sdl/

          # Copy man page
          cp BasiliskII/src/Unix/BasiliskII.1 ${PKG_DIR}/usr/share/man/man1/
          gzip -9 ${PKG_DIR}/usr/share/man/man1/BasiliskII.1

          # Copy documentation
          cp BasiliskII/README ${PKG_DIR}/usr/share/doc/basiliskii-sdl/
          cp BasiliskII/COPYING ${PKG_DIR}/usr/share/doc/basiliskii-sdl/copyright
          cp BasiliskII/ChangeLog ${PKG_DIR}/usr/share/doc/basiliskii-sdl/changelog
          gzip -9 ${PKG_DIR}/usr/share/doc/basiliskii-sdl/changelog

          # Copy SDL2 shared library
          cp /usr/local/lib/libSDL2-2.0.so.0 ${PKG_DIR}/usr/lib/

          # Calculate installed size
          INSTALLED_SIZE=$(du -sk ${PKG_DIR} | cut -f1)

          # Create control file
          cat > ${PKG_DIR}/DEBIAN/control << EOF
          Package: basiliskii-sdl
          Version: ${VERSION}
          Section: otherosfs
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libasound2, libsamplerate0, libmpfr6, libgmp10, libudev1, libdrm2, libgbm1, libvncserver1, libpng16-16
          Conflicts: basiliskii
          Provides: basiliskii
          Replaces: basiliskii
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Rui Carmo <https://github.com/rcarmo>
          Homepage: https://github.com/rcarmo/macemu
          Description: 68k Macintosh emulator (SDL build)
           Basilisk II is an Open Source 68k Macintosh emulator. It enables
           you to run 68k MacOS software on your computer, even if you are
           using a different operating system.
           .
           This is a lightweight SDL2 build optimized for Raspberry Pi,
           using framebuffer/KMS display without X11, Wayland, or GTK.
           .
           Features include:
            - Emulates Mac Classic or Mac II series machines
            - JIT compiler enabled for Raspberry Pi builds
            - Color video display via SDL2 (framebuffer/KMS)
            - CD quality sound output via SDL2/ALSA
            - Floppy disk driver (1.44MB disks)
            - HFS partitions and hardfiles support
            - CD-ROM driver with basic audio functions
            - Host directory tree file exchange
            - Ethernet and serial drivers
            - SCSI Manager emulation
            - Extended ADB keyboard and 3-button mouse
            - VNC server for remote display access
            - PNG framebuffer dump via SIGUSR2
           .
           This package is built for Raspberry Pi (ARM64).
          EOF

          # Remove leading whitespace from control file
          sed -i 's/^          //' ${PKG_DIR}/DEBIAN/control

          # Create postinst script
          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          ldconfig
          EOF
          chmod 755 ${PKG_DIR}/DEBIAN/postinst

          # Create postrm script
          cat > ${PKG_DIR}/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          set -e
          ldconfig
          EOF
          chmod 755 ${PKG_DIR}/DEBIAN/postrm

          # Set proper permissions
          find ${PKG_DIR} -type d -exec chmod 755 {} \;
          find ${PKG_DIR}/usr -type f -exec chmod 644 {} \;
          chmod 755 ${PKG_DIR}/usr/bin/BasiliskII
          chmod 755 ${PKG_DIR}/usr/lib/libSDL2-2.0.so.0

          # Build the package
          dpkg-deb --build --root-owner-group ${PKG_DIR}

          # Move package to output directory
          mkdir -p dist
          mv ${PKG_DIR}.deb dist/

          echo "=== Package built successfully ==="
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: basiliskii-sdl-arm64-deb
          path: dist/*.deb
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    name: Cleanup old workflow runs
    runs-on: ubuntu-latest
    needs: [build-arm64, build-armhf, build-sheepshaver-arm64, build-sheepshaver-armhf]
    permissions:
      contents: write
      actions: write

    steps:
      - name: Cleanup old workflow runs
        uses: actions/github-script@v9
        with:
          script: |
            const keepCount = 5;
            const { owner, repo } = context.repo;

            core.info('Fetching workflow runs...');
            const workflow_id = 'build-deb-rpi.yml';
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id,
                per_page: 100
              }
            );

            const sortedRuns = runs.sort((a, b) =>
              new Date(b.created_at) - new Date(a.created_at)
            );
            const runsToDelete = sortedRuns.slice(keepCount);

            core.info(`Found ${runs.length} workflow runs, keeping ${keepCount} newest, deleting ${runsToDelete.length} older...`);
            for (const run of runsToDelete) {
              core.info(`Deleting run #${run.run_number} from ${run.created_at}`);
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id
                });
              } catch (error) {
                core.warning(`Failed to delete run ${run.id}: ${error.message}`);
              }
            }

            core.info('Cleanup completed');

  build-armhf:
    runs-on: ubuntu-24.04-arm
    name: Build ARMhf (32-bit) .deb package (cross-compiled)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update -q -y
          sudo apt-get install -q -y \
            crossbuild-essential-armhf \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libasound2-dev:armhf \
            libudev-dev:armhf \
            libdbus-1-dev:armhf \
            libdrm-dev:armhf \
            libgbm-dev:armhf \
            libsamplerate0-dev:armhf \
            libmpfr-dev:armhf \
            libgmp-dev:armhf \
            libvncserver-dev:armhf \
            libpng-dev:armhf \
            wget \
            git \
            debhelper \
            devscripts \
            dh-make \
            fakeroot \
            lintian

      - name: Build SDL2 from source (cross-compile)
        run: |
          set -e
          echo "=== Building SDL2 ${SDL_VERSION} from source (armhf) ==="
          wget -q https://www.libsdl.org/release/SDL2-${SDL_VERSION}.tar.gz
          tar -zxf SDL2-${SDL_VERSION}.tar.gz
          cd SDL2-${SDL_VERSION}
          export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          ./configure \
            --host=arm-linux-gnueabihf \
            --prefix=/usr/local/armhf \
            --disable-video-opengl \
            --disable-video-x11 \
            --disable-pulseaudio \
            --disable-esd \
            --disable-video-wayland \
            --enable-video-kmsdrm \
            --enable-libudev \
            --enable-input-events
          echo "=== SDL2 configure summary (input related) ==="
          grep -i -E '(udev|evdev|input|kmsdrm|drm|gbm)' config.log | tail -30 || true
          make -j$(nproc)
          sudo make install

      - name: Build BasiliskII (cross-compile)
        run: |
          set -e
          echo "=== Building BasiliskII (armhf) ==="
          cd BasiliskII/src/Unix
          NO_CONFIGURE=1 ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/armhf/lib/pkgconfig
          export CPPFLAGS="-I/usr/local/armhf/include -I/usr/local/armhf/include/SDL2"
          export LDFLAGS="-L/usr/local/armhf/lib -Wl,-rpath,/usr/local/armhf/lib"
          CFLAGS="-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -mtune=cortex-a53" \
          CXXFLAGS="-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -mtune=cortex-a53" \
          ac_cv_have_asm_extended_signals=yes \
          ./configure \
            --host=arm-linux-gnueabihf \
            --prefix=/usr \
            --enable-sdl-audio \
            --enable-sdl-video \
            --enable-vosf \
            --enable-addressing=direct \
            --without-mon \
            --without-esd \
            --without-gtk \
            --with-vncserver \
            --enable-jit-compiler \
            --enable-arm-jit-experimental \
            --disable-nls
          make -j$(nproc)

      - name: Create Debian package
        run: |
          set -e
          echo "=== Creating Debian package ==="

          # Get version from git or use default
          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            VERSION="1.0.$(date +%Y%m%d)"
          fi

          ARCH="armhf"
          PKG_NAME="basiliskii-sdl"
          PKG_DIR="${PKG_NAME}_${VERSION}_${ARCH}"

          # Create package directory structure
          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/share/basiliskii-sdl
          mkdir -p ${PKG_DIR}/usr/share/man/man1
          mkdir -p ${PKG_DIR}/usr/share/doc/basiliskii-sdl
          mkdir -p ${PKG_DIR}/usr/lib

          # Copy binary
          cp BasiliskII/src/Unix/BasiliskII ${PKG_DIR}/usr/bin/
          arm-linux-gnueabihf-strip ${PKG_DIR}/usr/bin/BasiliskII

          # Copy data files
          cp BasiliskII/src/Unix/keycodes ${PKG_DIR}/usr/share/basiliskii-sdl/
          cp BasiliskII/src/Unix/fbdevices ${PKG_DIR}/usr/share/basiliskii-sdl/
          cp BasiliskII/src/Unix/tunconfig ${PKG_DIR}/usr/share/basiliskii-sdl/

          # Copy man page
          cp BasiliskII/src/Unix/BasiliskII.1 ${PKG_DIR}/usr/share/man/man1/
          gzip -9 ${PKG_DIR}/usr/share/man/man1/BasiliskII.1

          # Copy documentation
          cp BasiliskII/README ${PKG_DIR}/usr/share/doc/basiliskii-sdl/
          cp BasiliskII/COPYING ${PKG_DIR}/usr/share/doc/basiliskii-sdl/copyright
          cp BasiliskII/ChangeLog ${PKG_DIR}/usr/share/doc/basiliskii-sdl/changelog
          gzip -9 ${PKG_DIR}/usr/share/doc/basiliskii-sdl/changelog

          # Copy SDL2 shared library
          cp /usr/local/armhf/lib/libSDL2-2.0.so.0 ${PKG_DIR}/usr/lib/

          # Calculate installed size
          INSTALLED_SIZE=$(du -sk ${PKG_DIR} | cut -f1)

          # Create control file
          cat > ${PKG_DIR}/DEBIAN/control << EOF
          Package: basiliskii-sdl
          Version: ${VERSION}
          Section: otherosfs
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libasound2, libsamplerate0, libmpfr6, libgmp10, libudev1, libdrm2, libgbm1, libvncserver1, libpng16-16
          Conflicts: basiliskii
          Provides: basiliskii
          Replaces: basiliskii
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Rui Carmo <https://github.com/rcarmo>
          Homepage: https://github.com/rcarmo/macemu
          Description: 68k Macintosh emulator (SDL build)
           Basilisk II is an Open Source 68k Macintosh emulator. It enables
           you to run 68k MacOS software on your computer, even if you are
           using a different operating system.
           .
           This is a lightweight SDL2 build optimized for Raspberry Pi,
           using framebuffer/KMS display without X11, Wayland, or GTK.
           .
           Features include:
            - Emulates Mac Classic or Mac II series machines
            - JIT compiler enabled for Raspberry Pi builds
            - Color video display via SDL2 (framebuffer/KMS)
            - CD quality sound output via SDL2/ALSA
            - Floppy disk driver (1.44MB disks)
            - HFS partitions and hardfiles support
            - CD-ROM driver with basic audio functions
            - Host directory tree file exchange
            - Ethernet and serial drivers
            - SCSI Manager emulation
            - Extended ADB keyboard and 3-button mouse
            - VNC server for remote display access
            - PNG framebuffer dump via SIGUSR2
           .
           This package is built for Raspberry Pi (ARMhf/32-bit).
          EOF

          # Remove leading whitespace from control file
          sed -i 's/^          //' ${PKG_DIR}/DEBIAN/control

          # Create postinst script
          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          ldconfig
          EOF
          chmod 755 ${PKG_DIR}/DEBIAN/postinst

          # Create postrm script
          cat > ${PKG_DIR}/DEBIAN/postrm << 'EOF'
          #!/bin/bash
          set -e
          ldconfig
          EOF
          chmod 755 ${PKG_DIR}/DEBIAN/postrm

          # Set proper permissions
          find ${PKG_DIR} -type d -exec chmod 755 {} \;
          find ${PKG_DIR}/usr -type f -exec chmod 644 {} \;
          chmod 755 ${PKG_DIR}/usr/bin/BasiliskII
          chmod 755 ${PKG_DIR}/usr/lib/libSDL2-2.0.so.0

          # Build the package
          dpkg-deb --build --root-owner-group ${PKG_DIR}

          # Move package to output directory
          mkdir -p dist
          mv ${PKG_DIR}.deb dist/

          echo "=== Package built successfully ==="
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: basiliskii-sdl-armhf-deb
          path: dist/*.deb
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sheepshaver-arm64:
    runs-on: ubuntu-24.04-arm
    name: Build SheepShaver ARM64 .deb package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update -q -y
          sudo apt-get install -q -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libdbus-1-dev \
            libdrm-dev \
            libgbm-dev \
            libvncserver-dev \
            wget \
            git \
            debhelper \
            devscripts \
            dh-make \
            fakeroot \
            lintian

      - name: Build SDL2 from source
        run: |
          set -e
          echo "=== Building SDL2 ${SDL_VERSION} from source ==="
          wget -q https://www.libsdl.org/release/SDL2-${SDL_VERSION}.tar.gz
          tar -zxf SDL2-${SDL_VERSION}.tar.gz
          cd SDL2-${SDL_VERSION}
          ./configure \
            --prefix=/usr/local \
            --disable-video-opengl \
            --disable-video-x11 \
            --disable-pulseaudio \
            --disable-esd \
            --disable-video-wayland \
            --enable-video-kmsdrm \
            --enable-libudev \
            --enable-input-events
          echo "=== SDL2 configure summary (input/video related) ==="
          grep -i -E '(udev|evdev|input|kmsdrm|drm|gbm)' config.log | tail -30 || true
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Build SheepShaver
        run: |
          set -e
          echo "=== Building SheepShaver ==="
          cd SheepShaver/src/Unix
          NO_CONFIGURE=1 ./autogen.sh
          CFLAGS="-march=armv8-a -mtune=cortex-a72" \
          CXXFLAGS="-march=armv8-a -mtune=cortex-a72" \
          LDFLAGS="" \
          ./configure \
            --prefix=/usr \
            --enable-sdl-audio \
            --enable-sdl-video \
            --disable-fbdev-dga \
            --disable-xf86-dga \
            --disable-xf86-vidmode \
            --disable-vosf \
            --without-mon \
            --without-esd \
            --without-gtk \
            --enable-jit
          CPATH=$CPATH:/usr/local/include/SDL2 make -j$(nproc)

      - name: Create Debian package
        run: |
          set -e
          echo "=== Creating SheepShaver Debian package ==="

          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            VERSION="1.0.$(date +%Y%m%d)"
          fi

          ARCH="arm64"
          PKG_NAME="sheepshaver-sdl"
          PKG_DIR="${PKG_NAME}_${VERSION}_${ARCH}"

          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/share/sheepshaver-sdl
          mkdir -p ${PKG_DIR}/usr/share/man/man1
          mkdir -p ${PKG_DIR}/usr/share/doc/sheepshaver-sdl
          mkdir -p ${PKG_DIR}/usr/lib

          cp SheepShaver/src/Unix/SheepShaver ${PKG_DIR}/usr/bin/
          strip ${PKG_DIR}/usr/bin/SheepShaver

          cp SheepShaver/src/SDL/keycodes ${PKG_DIR}/usr/share/sheepshaver-sdl/
          cp SheepShaver/src/Unix/tunconfig ${PKG_DIR}/usr/share/sheepshaver-sdl/
          cp SheepShaver/src/Unix/SheepShaver.1 ${PKG_DIR}/usr/share/man/man1/
          gzip -9 ${PKG_DIR}/usr/share/man/man1/SheepShaver.1

          cp SheepShaver/COPYING ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/copyright
          cp SheepShaver/NEWS ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/changelog
          cp SheepShaver/AARCH64_JIT_PLAN.md ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/
          gzip -9 ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/changelog

          cp /usr/local/lib/libSDL2-2.0.so.0 ${PKG_DIR}/usr/lib/

          INSTALLED_SIZE=$(du -sk ${PKG_DIR} | cut -f1)

          cat > ${PKG_DIR}/DEBIAN/control << EOF_CONTROL
          Package: sheepshaver-sdl
          Version: ${VERSION}
          Section: otherosfs
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libasound2, libudev1, libdbus-1-3, libdrm2, libgbm1, libvncserver1
          Conflicts: sheepshaver
          Provides: sheepshaver
          Replaces: sheepshaver
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Rui Carmo <https://github.com/rcarmo>
          Homepage: https://github.com/rcarmo/macemu
          Description: PowerPC Macintosh emulator (SDL build)
           SheepShaver is an Open Source PowerPC Macintosh emulator. It enables
           you to run classic PowerPC Mac OS software on another operating system.
           .
           This is a lightweight SDL2 build optimized for Raspberry Pi using the
           same direct-display assumptions as the BasiliskII SDL package:
           framebuffer/KMS display, ALSA audio, no X11, no Wayland, no GTK, and
           no OpenGL dependency.
           .
           Features include:
            - Emulates Old World Power Macintosh systems
            - JIT compiler enabled where supported on Raspberry Pi builds
            - Color video display via SDL2 (framebuffer/KMS)
            - Sound output via SDL2/ALSA
            - HFS partitions and hardfiles support
            - Host directory tree file exchange
            - VNC server for remote display access
           .
           This package is built for Raspberry Pi (ARM64).
          EOF_CONTROL

          sed -i 's/^          //' ${PKG_DIR}/DEBIAN/control

          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF_SCRIPT'
          #!/bin/bash
          set -e
          ldconfig
          EOF_SCRIPT
          chmod 755 ${PKG_DIR}/DEBIAN/postinst

          cat > ${PKG_DIR}/DEBIAN/postrm << 'EOF_SCRIPT'
          #!/bin/bash
          set -e
          ldconfig
          EOF_SCRIPT
          chmod 755 ${PKG_DIR}/DEBIAN/postrm

          find ${PKG_DIR} -type d -exec chmod 755 {} \;
          find ${PKG_DIR}/usr -type f -exec chmod 644 {} \;
          chmod 755 ${PKG_DIR}/usr/bin/SheepShaver
          chmod 755 ${PKG_DIR}/usr/lib/libSDL2-2.0.so.0

          dpkg-deb --build --root-owner-group ${PKG_DIR}
          mkdir -p dist
          mv ${PKG_DIR}.deb dist/
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheepshaver-sdl-arm64-deb
          path: dist/*.deb
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sheepshaver-armhf:
    runs-on: ubuntu-24.04-arm
    name: Build SheepShaver ARMhf (32-bit) .deb package (cross-compiled)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install cross-compilation toolchain
        run: |
          sudo dpkg --add-architecture armhf
          sudo apt-get update -q -y
          sudo apt-get install -q -y \
            crossbuild-essential-armhf \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libasound2-dev:armhf \
            libudev-dev:armhf \
            libdbus-1-dev:armhf \
            libdrm-dev:armhf \
            libgbm-dev:armhf \
            libvncserver-dev:armhf \
            wget \
            git \
            debhelper \
            devscripts \
            dh-make \
            fakeroot \
            lintian

      - name: Build SDL2 from source (cross-compile)
        run: |
          set -e
          echo "=== Building SDL2 ${SDL_VERSION} from source (armhf) ==="
          wget -q https://www.libsdl.org/release/SDL2-${SDL_VERSION}.tar.gz
          tar -zxf SDL2-${SDL_VERSION}.tar.gz
          cd SDL2-${SDL_VERSION}
          export PKG_CONFIG_LIBDIR=/usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
          ./configure \
            --host=arm-linux-gnueabihf \
            --prefix=/usr/local/armhf \
            --disable-video-opengl \
            --disable-video-x11 \
            --disable-pulseaudio \
            --disable-esd \
            --disable-video-wayland \
            --enable-video-kmsdrm \
            --enable-libudev \
            --enable-input-events
          echo "=== SDL2 configure summary (input/video related) ==="
          grep -i -E '(udev|evdev|input|kmsdrm|drm|gbm)' config.log | tail -30 || true
          make -j$(nproc)
          sudo make install

      - name: Build SheepShaver (cross-compile)
        run: |
          set -e
          echo "=== Building SheepShaver (armhf) ==="
          cd SheepShaver/src/Unix
          NO_CONFIGURE=1 ./autogen.sh
          export PKG_CONFIG_PATH=/usr/local/armhf/lib/pkgconfig
          export CPPFLAGS="-I/usr/local/armhf/include -I/usr/local/armhf/include/SDL2"
          export LDFLAGS="-L/usr/local/armhf/lib -Wl,-rpath,/usr/local/armhf/lib"
          CFLAGS="-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -mtune=cortex-a53" \
          CXXFLAGS="-march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard -mtune=cortex-a53" \
          ./configure \
            --host=arm-linux-gnueabihf \
            --prefix=/usr \
            --enable-sdl-audio \
            --enable-sdl-video \
            --disable-fbdev-dga \
            --disable-xf86-dga \
            --disable-xf86-vidmode \
            --disable-vosf \
            --without-mon \
            --without-esd \
            --without-gtk \
            --enable-jit
          make -j$(nproc)

      - name: Create Debian package
        run: |
          set -e
          echo "=== Creating SheepShaver Debian package ==="

          if git describe --tags --exact-match 2>/dev/null; then
            VERSION=$(git describe --tags --exact-match | sed 's/^v//')
          else
            VERSION="1.0.$(date +%Y%m%d)"
          fi

          ARCH="armhf"
          PKG_NAME="sheepshaver-sdl"
          PKG_DIR="${PKG_NAME}_${VERSION}_${ARCH}"

          mkdir -p ${PKG_DIR}/DEBIAN
          mkdir -p ${PKG_DIR}/usr/bin
          mkdir -p ${PKG_DIR}/usr/share/sheepshaver-sdl
          mkdir -p ${PKG_DIR}/usr/share/man/man1
          mkdir -p ${PKG_DIR}/usr/share/doc/sheepshaver-sdl
          mkdir -p ${PKG_DIR}/usr/lib

          cp SheepShaver/src/Unix/SheepShaver ${PKG_DIR}/usr/bin/
          arm-linux-gnueabihf-strip ${PKG_DIR}/usr/bin/SheepShaver

          cp SheepShaver/src/SDL/keycodes ${PKG_DIR}/usr/share/sheepshaver-sdl/
          cp SheepShaver/src/Unix/tunconfig ${PKG_DIR}/usr/share/sheepshaver-sdl/
          cp SheepShaver/src/Unix/SheepShaver.1 ${PKG_DIR}/usr/share/man/man1/
          gzip -9 ${PKG_DIR}/usr/share/man/man1/SheepShaver.1

          cp SheepShaver/COPYING ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/copyright
          cp SheepShaver/NEWS ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/changelog
          cp SheepShaver/AARCH64_JIT_PLAN.md ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/
          gzip -9 ${PKG_DIR}/usr/share/doc/sheepshaver-sdl/changelog

          cp /usr/local/armhf/lib/libSDL2-2.0.so.0 ${PKG_DIR}/usr/lib/

          INSTALLED_SIZE=$(du -sk ${PKG_DIR} | cut -f1)

          cat > ${PKG_DIR}/DEBIAN/control << EOF_CONTROL
          Package: sheepshaver-sdl
          Version: ${VERSION}
          Section: otherosfs
          Priority: optional
          Architecture: ${ARCH}
          Depends: libc6, libasound2, libudev1, libdbus-1-3, libdrm2, libgbm1, libvncserver1
          Conflicts: sheepshaver
          Provides: sheepshaver
          Replaces: sheepshaver
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: Rui Carmo <https://github.com/rcarmo>
          Homepage: https://github.com/rcarmo/macemu
          Description: PowerPC Macintosh emulator (SDL build)
           SheepShaver is an Open Source PowerPC Macintosh emulator. It enables
           you to run classic PowerPC Mac OS software on another operating system.
           .
           This is a lightweight SDL2 build optimized for Raspberry Pi using the
           same direct-display assumptions as the BasiliskII SDL package:
           framebuffer/KMS display, ALSA audio, no X11, no Wayland, no GTK, and
           no OpenGL dependency.
           .
           Features include:
            - Emulates Old World Power Macintosh systems
            - JIT compiler enabled where supported on Raspberry Pi builds
            - Color video display via SDL2 (framebuffer/KMS)
            - Sound output via SDL2/ALSA
            - HFS partitions and hardfiles support
            - Host directory tree file exchange
            - VNC server for remote display access
           .
           This package is built for Raspberry Pi (ARMhf/32-bit).
          EOF_CONTROL

          sed -i 's/^          //' ${PKG_DIR}/DEBIAN/control

          cat > ${PKG_DIR}/DEBIAN/postinst << 'EOF_SCRIPT'
          #!/bin/bash
          set -e
          ldconfig
          EOF_SCRIPT
          chmod 755 ${PKG_DIR}/DEBIAN/postinst

          cat > ${PKG_DIR}/DEBIAN/postrm << 'EOF_SCRIPT'
          #!/bin/bash
          set -e
          ldconfig
          EOF_SCRIPT
          chmod 755 ${PKG_DIR}/DEBIAN/postrm

          find ${PKG_DIR} -type d -exec chmod 755 {} \;
          find ${PKG_DIR}/usr -type f -exec chmod 644 {} \;
          chmod 755 ${PKG_DIR}/usr/bin/SheepShaver
          chmod 755 ${PKG_DIR}/usr/lib/libSDL2-2.0.so.0

          dpkg-deb --build --root-owner-group ${PKG_DIR}
          mkdir -p dist
          mv ${PKG_DIR}.deb dist/
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheepshaver-sdl-armhf-deb
          path: dist/*.deb
          retention-days: 7

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
